[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lessonforge"
version = "0.1.0"
description = "A self-evaluating AI lesson content generation system"
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.2.16",
    "langchain==1.4.6",
    "langchain-google-genai==4.4.2",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]